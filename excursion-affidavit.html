
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIT Excursion Affidavit Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    padding:40px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.form-box{
    background:#fff;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.note{
    background:#fff8e1;
    border-left:4px solid #f59e0b;
    padding:15px;
    border-radius:8px;
    margin-bottom:25px;
    line-height:1.7;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:14px;
}

.button-group{
    margin-top:25px;
}

button{
    padding:14px 24px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    margin-right:10px;
}

.preview-btn{
    background:#2563eb;
    color:white;
}

.pdf-btn{
    background:#16a34a;
    color:white;
}

#preview{
    margin-top:40px;
}

.document-preview{

    background:white;

    max-width:900px;

    margin:auto;

    padding:60px;

    font-family:"Times New Roman",serif;

    line-height:1.9;

    box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.preview-title{

    text-align:center;

    font-size:22px;

    font-weight:bold;

    margin-bottom:35px;

}

</style>
</head>

<body>

<div class="container">

<div class="form-box">

<h1>Excursion Affidavit Generator</h1>

<p class="subtitle">
Generate Affidavit for Participation in Excursions / Picnics / Tours
</p>

<div class="note">

<strong>Note :-</strong>

This is the Format of the Affidavit for participation in
Excursions/Picnics/Tours organised by AIT to be given on
stamp paper worth Rs 100/- duly notarized.

</div>

<div class="grid">

<input
type="text"
id="studentName"
placeholder="Student Name">

<input
type="text"
id="fatherName"
placeholder="Father / Guardian Name">

<input
type="text"
id="place"
placeholder="Place">

<input
type="text"
id="date"
placeholder="Date">

</div>

<div class="button-group">

<button
class="preview-btn"
onclick="generatePreview()">

Generate Preview

</button>

<button
class="pdf-btn"
onclick="generatePDF()">

Generate PDF

</button>

</div>

</div>

<div id="preview"></div>

</div>

<script src="excursion-affidavit.js"></script>

</body>
</html>
